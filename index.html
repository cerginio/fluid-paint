<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Fluid Paint</title>

    <meta name="description" content="Fluid paint simulation">

    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

    <link rel="stylesheet" href="app/layout.css">
</head>

<body>
    <!--
      Phase 7: the chrome is real DOM rather than pixels drawn into the canvas.
      The canvas fills #canvas-cell (sized by a ResizeObserver, not by the
      window), and #ui floats OVER it and is dragged where the user wants -- so
      the painting never loses width to chrome.
    -->
    <script type="text/template" id="main">
    <div id="canvas-cell"></div>

    <!--
      The floating tool panel. It sits OVER the canvas and is dragged by its
      grip, so the painting never loses width to chrome -- the Phase 6 retest
      found a docked column costs a phone too much of the picture.

      #panel-bar is always visible and is the entire UI when collapsed:

          [-----*------]  :::  [ |||||||||||| ]
           brush size   grip     hue stripe

      Those are the two controls a painter changes mid-stroke. Everything else
      lives in #panel-body, which the grip toggles.
    -->
    <div id="ui" data-collapsed="false">
        <div id="panel-bar">
            <div id="bar-size-slider" class="slider"></div>
            <div id="panel-grip" title="Drag to move, tap to collapse">
                <span></span><span></span><span></span>
            </div>
            <div id="bar-hue-stripe"><div class="handle"></div></div>
        </div>

        <div id="panel-body">
            <div id="clear-button" class="button">Clear</div>
            <a id="save-button" class="button">Save</a>
            <div class="control-label">Quality</div>
            <div class="buttons" id="qualities"></div>
            <div style="clear:both"></div>
            <div class="control-label">Color Mode</div>
            <div class="buttons" id="models"></div>
            <div style="clear:both"></div>
            <div class="control-label">Paint Fluidity</div>
            <div id="fluidity-slider" class="slider"></div>
            <div class="control-label">Bristle Count</div>
            <div id="bristles-slider" class="slider"></div>
            <div class="control-label">Brush Size</div>
            <div id="size-slider" class="slider"></div>
            <div class="control-label">Paint Color</div>
            <!-- A reserved box, not the widget: the picker is still GL-drawn
                 into the main canvas until Phase 8 replaces it. paint.js reads
                 this element's rect so the picker follows the panel. -->
            <div id="color-picker-slot"></div>
            <div id="undo-button" class="button">Undo</div>
            <div id="redo-button" class="button">Redo</div>
        </div>
    </div>

    <div id="footer">
        <a href="http://david.li">david.li</a> | <a href="http://github.com/dli/paint">Origin code</a>
    </div>

    </script>
    <script type="text/template" id="no-support">
        <div id="no-support-container">
            <div id="error"></div>
            <div id="backlink"><a href="/">Back to root</a></div>
        </div>
    </script>

    <div id="app">
        <div id="placeholder"></div>
    </div>

    <script src="debug/deterministic-rng.js"></script>
    <script src="fluid-engine/gl/glsl3.js"></script>
    <script src="debug/debug-flags.js"></script>
    <script src="debug/painting-rect-overlay.js"></script>
    <script src="debug/gpu-profiles.js"></script>
    <script src="debug/texture-selftest.js"></script>
    <script src="debug/device-diag.js"></script>
    <script src="debug/golden-harness.js"></script>
    <script src="fluid-engine/gl/wrappedgl.js"></script>
    <script src="common.js"></script>
    <script src="debug.js"></script>
    <script src="utilities.js"></script>
    <script src="rectangle.js"></script>
    <script src="viewport.js"></script>
    <script src="fluid-engine/brush.js"></script>
    <script src="fluid-engine/simulation.js"></script>
    <script src="fluid-engine/renderer.js"></script>
    <script src="fluid-engine/index.js"></script>
    <script src="colorpicker.js"></script>
    <script src="slider.js"></script>
    <script src="buttons.js"></script>
    <script src="brushviewer.js"></script>
    <script src="app/ui/pointer-dispatcher.js"></script>
    <script src="app/ui/panel.js"></script>
    <script src="paint-setup.js"></script>
    <script src="paint.js"></script>

    <script>
        // ---- globals ----
        let presenter;             // will be assigned after DOM is ready
        let debugCanvas;           // global handle to the debug canvas
        let debugCtx2d;            // (optional) its 2D context

        document.addEventListener('DOMContentLoaded', () => {
            // The main app canvas. It is created and given a GL context BEFORE
            // the layout template is injected, because the capability probes
            // below decide whether the app renders at all -- and their answer
            // decides which template gets injected. It is moved into
            // #canvas-cell once that element exists (Phase 7); until then it
            // stays out of the document flow so it cannot size <body>.
            const canvas = document.createElement('canvas');
            canvas.style.position = 'absolute';
            document.body.appendChild(canvas);

            // ---- device-emulation harness (see docs/MOBILE-GPU-BRISTLE-COLLAPSE-SPEC.md) ----
            // ?gpu=samsung-a56   clamp capabilities to a target mobile device
            // ?selftest=1        run the texture round-trip assertions
            // ?audit=1           log every FLOAT+LINEAR texture creation
            const params = new URLSearchParams(location.search);
            const gpuProfile = params.get('gpu');

            const wgl = WrappedGL.create(canvas, null, (rawGl) => {
                if (gpuProfile) installGpuClamp(rawGl, gpuProfile);
            });

            window.__wgl = wgl;   // debug handle for the test harness
            if (wgl !== null) {
                if (params.get('audit') === '1') auditFloatLinearTextures(wgl);
                if (params.get('selftest') === '1') runTextureSelfTest(wgl.gl);
                if (params.get('diag') === '1') showDeviceDiagnostics(wgl);
            }

            // The texture probe: a 2D view of a brush texture, read back each
            // frame from brush.js. Enabled by default, ?debug=-textureProbe
            // turns it off -- and when off nothing here is created, which is
            // what makes brush.js's `if (presenter)` skip the readback rather
            // than merely hide its output.
            const debugFlags = parseDebugFlags();
            if (debugFlags.textureProbe) {
                // create the debug canvas now that DOM exists
                const dbg = setupDebugCanvas({ w: 256, h: 256, corner: 'bottom-right' });
                debugCanvas = dbg.canvas;          // <-- assign to globals
                debugCtx2d = dbg.ctx2d;

                // presenter uses the same WebGL context
                presenter = makeGLDebugPresenter(wgl.gl);
            }

            (async () => {
                // Renderable is not blendable. hasFloatTextureSupport() only
                // asks whether a float target can be drawn into; splat()
                // additionally needs to ALPHA-BLEND into one, and a device
                // that cannot do so at any precision silently deposits
                // nothing. Ask that question here rather than letting the app
                // start up and look healthy while painting nothing.
                const halfFloatType = wgl !== null ? wgl.getHalfFloatType() : null;
                const canPaint = wgl !== null && wgl.hasFloatTextureSupport() &&
                    (wgl.canBlendIntoTexture(wgl.FLOAT) ||
                     (halfFloatType !== null && wgl.canBlendIntoTexture(halfFloatType)));

                if (canPaint) {

                    //required features are supported
                    document.getElementById('placeholder').outerHTML = document.getElementById('main').innerHTML;

                    // Move the canvas into its grid cell now that the layout
                    // exists, and drop the absolute positioning the bootstrap
                    // used to keep it from sizing <body>: inside the cell the
                    // stylesheet positions it. Paint's Viewport then sizes the
                    // canvas from this element rather than from the window.
                    const canvasCell = document.getElementById('canvas-cell');
                    canvas.style.position = '';
                    canvasCell.appendChild(canvas);

                    const painter = new Paint(canvas, wgl, { container: canvasCell });
                    window.__painter = painter;   // handle for the golden harness

                    // ?golden=basic|colorMix|wetBlend|all -- scripted stroke, hashed readback
                    const goldenScenario = params.get('golden');
                    if (goldenScenario) {
                        scheduleGoldenSuite(() => window.__painter, goldenScenario);
                    }
                } else {
                    //required features unsupported
                    document.getElementById('placeholder').outerHTML = document.getElementById('no-support').innerHTML;

                    if (wgl === null) {
                        document.getElementById('error').innerHTML = 'Unfortunately, your browser does not support WebGL.';
                    } else if (!wgl.hasFloatTextureSupport()) {
                        document.getElementById('error').innerHTML = 'Unfortunately, your browser does not support WebGL floating point textures.';
                    } else {
                        // Float textures exist and are renderable, but cannot be
                        // blended into at any precision, so no stroke could ever
                        // deposit paint. Say so, rather than showing a canvas
                        // that looks fine and stays blank forever.
                        document.getElementById('error').innerHTML =
                            'Unfortunately, your browser cannot blend into floating point textures, which this app needs in order to paint.';
                    }
                }

            })().catch(err => console.error(err));
        });

    </script>
</body>

</html>
