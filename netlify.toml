[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Immutable definitions are generated as exact SHA-256 paths in dist/_headers.
# Never wildcard fixed names such as /bundle.js or /app/layout.css.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/precache-inventory.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
